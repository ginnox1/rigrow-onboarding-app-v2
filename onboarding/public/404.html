<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigrow - Not Found</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      font-family: var(--font);
    }
    .container {
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .error-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">
      <!-- Content injected by JS -->
    </div>
  </div>

  <script>
    const contentDiv = document.getElementById('content');
    const url = window.location.pathname;

    if (url.includes('/apk-download/')) {
      // Specific APK Maintenance Message
      contentDiv.innerHTML = `
        <div class="maintenance-notice">
          <div class="maintenance-icon">🛠️</div>
          <h3>App Update in Progress</h3>
          <p>The Android APK is currently unavailable due to scheduled maintenance. We are working to get it back online as quickly as possible.</p>
          <div class="maintenance-footer">Please check back soon!</div>
        </div>
      `;
    } else {
      // Generic Professional 404
      contentDiv.innerHTML = `
        <div class="maintenance-notice">
          <div class="error-icon">🔍</div>
          <h3>Page Not Found</h3>
          <p>Sorry, the page you are looking for doesn't exist or has been moved.</p>
          <a href="/" class="btn-primary" style="display:inline-block; width:auto; padding: 10px 24px; margin-top:16px; text-decoration:none;">Return Home</a>
        </div>
      `;
    }
  </script>
</body>
</html>
